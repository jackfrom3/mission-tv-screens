<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Current Rotation — Mission Performance SB</title>
<style>
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0c0c0d; }
  iframe { position: absolute; inset: 0; display: block; width: 100vw; height: 100vh; border: none; opacity: 0; transition: opacity 0.35s ease; }
  iframe.on { opacity: 1; }
</style>
</head>
<body>
<iframe id="a"></iframe>
<iframe id="b"></iframe>
<script>
  // Update this list each month: swap the itinerary + bracket for the new month.
  var screens = [
    "gym_rules_tv.html",
    "november_itinerary_tv.html",
    "thanksgiving_food_bracket_tv.html",
    "leaderboard_attendance_tv.html",
    "leaderboard_testing_male_tv.html",
    "leaderboard_testing_female_tv.html"
  ];
  var SECONDS_PER_SCREEN = 18;
  var i = 0;

  // THEME: 1950s Thanksgiving look on every screen until Mon 11/30/2026 (turns itself off after).
  var THEME_UNTIL = new Date("2026-11-30T00:00:00-08:00");
  if (new Date() < THEME_UNTIL) document.body.style.background = "#173840";
  var THEME_VERSION = Date.now() - Date.now() % 3600000; // re-fetch the theme at most hourly
  var SCENE = "thanksgiving_art/scene50s.svg?v=" + THEME_VERSION;
  // starburst badge: spinning mustard rays around a coral disc
  var rays = "";
  for (var r = 0; r < 16; r++) rays += '<path d="M100 100 L' + (100 + 98 * Math.cos(r * Math.PI / 8 - 0.09)).toFixed(1) + ' ' + (100 + 98 * Math.sin(r * Math.PI / 8 - 0.09)).toFixed(1) + ' L' + (100 + 98 * Math.cos(r * Math.PI / 8 + 0.09)).toFixed(1) + ' ' + (100 + 98 * Math.sin(r * Math.PI / 8 + 0.09)).toFixed(1) + 'z"/>';
  var BADGE = '<svg viewBox="0 0 200 200"><g class="tg-rays" fill="#e8c26a">' + rays + '</g>' +
    '<circle cx="100" cy="100" r="64" fill="#f07a62" stroke="#f2e3c4" stroke-width="5"/>' +
    '<circle cx="100" cy="100" r="54" fill="none" stroke="#f2e3c4" stroke-width="2" stroke-dasharray="4 5"/>' +
    '<text x="100" y="92" text-anchor="middle" font-family="Yellowtail, cursive" font-size="34" fill="#fff">Happy</text>' +
    '<text x="100" y="122" text-anchor="middle" font-family="Barlow, sans-serif" font-weight="800" font-size="14" letter-spacing="1.5" fill="#173840">TURKEY DAY!</text></svg>';
  // Dresses up a loaded screen, then calls done() once the stylesheet + scene are in.
  function theme(frame, idx, done) {
    if (new Date() >= THEME_UNTIL) return done();
    try {
      var d = frame.contentDocument;
      var waiting = 2; // stylesheet + scene
      var ready = function () { if (--waiting === 0) done(); };
      setTimeout(done, 3000);
      var link = d.createElement("link");
      link.rel = "stylesheet";
      link.href = "thanksgiving.css?v=" + THEME_VERSION;
      link.onload = link.onerror = ready;
      d.head.appendChild(link);
      var back = d.createElement("div");
      back.className = "tg-fx tg-back";
      back.innerHTML = '<img class="tg-scene" alt=""><div class="tg-shade"></div>';
      var img = back.querySelector("img");
      img.onload = img.onerror = ready;
      img.src = SCENE;
      d.body.appendChild(back);
      var fx = d.createElement("div");
      fx.className = "tg-fx";
      fx.innerHTML = '<div class="tg-frame"></div><div class="tg-badge">' + BADGE + '</div>';
      d.body.appendChild(fx);
    } catch (e) { done(); }
  }

  // Two frames: the next screen loads hidden, gets its theme, then fades in over the
  // current one, so the plain look never flashes on the TV.
  var frames = [document.getElementById("a"), document.getElementById("b")];
  var cur = 0;
  function show(index) {
    var next = frames[1 - cur];
    next.onload = function () {
      var shown = false;
      theme(next, index, function () {
        if (shown) return;
        shown = true;
        setTimeout(function () {
          // new screen fades in on top while the old one stays solid underneath
          var old = frames[cur];
          next.style.zIndex = 2;
          old.style.zIndex = 1;
          next.classList.add("on");
          cur = 1 - cur;
          // then hide the old one and stop its animations
          setTimeout(function () { old.classList.remove("on"); old.onload = null; old.src = "about:blank"; }, 500);
        }, 300);
      });
    };
    next.src = screens[index] + "?_r=" + Date.now();
  }

  show(i);
  setInterval(function () {
    i = (i + 1) % screens.length;
    show(i);
  }, SECONDS_PER_SCREEN * 1000);
</script>
</body>
</html>
