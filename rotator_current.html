<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Current Rotation — Mission Performance SB</title>
<style>
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0c0c0d; }
  iframe { position: absolute; inset: 0; display: block; width: 100vw; height: 100vh; border: none; opacity: 0; transition: opacity 0.35s ease; }
  iframe.on { opacity: 1; }
</style>
</head>
<body>
<iframe id="a"></iframe>
<iframe id="b"></iframe>
<script>
  // Update this list each month: swap the itinerary + bracket for the new month.
  var screens = [
    "gym_rules_tv.html",
    "november_itinerary_tv.html",
    "thanksgiving_food_bracket_tv.html",
    "leaderboard_attendance_tv.html",
    "leaderboard_testing_male_tv.html",
    "leaderboard_testing_female_tv.html"
  ];
  var SECONDS_PER_SCREEN = 18;
  var i = 0;

  // THEME: Thanksgiving harvest look on every screen until Mon 11/30/2026 (turns itself off after).
  var THEME_UNTIL = new Date("2026-11-30T00:00:00-08:00");
  if (new Date() < THEME_UNTIL) document.body.style.background = "#2a0f08";
  var THEME_VERSION = Date.now() - Date.now() % 3600000; // re-fetch the theme at most hourly
  var LEAF_COLORS = ["#d9541e", "#f0a020", "#a3243b", "#c97a1a", "#e2b33c", "#b8441a", "#8f2a1c", "#e07b28"];
  // Two rounded leaf shapes (lobed oak + smooth teardrop), alternated.
  var LEAVES = [
    '<svg viewBox="0 0 40 46"><path fill="C" d="M20 3c5 0 7 5 5 9c5-2 9 2 7 6c-1 2-3 3-5 3c5 1 7 6 4 9c-2 2-5 2-7 1c1 4-1 7-4 7c-3 0-5-3-4-7c-2 1-5 1-7-1c-3-3-1-8 4-9c-2 0-4-1-5-3c-2-4 2-8 7-6c-2-4 0-9 5-9z"/><path d="M20 9v36" stroke="#3a1608" stroke-width="1.4" fill="none" opacity=".6"/></svg>',
    '<svg viewBox="0 0 40 46"><path fill="C" d="M20 3C31 10 36 20 33 29C31 35 26 39 20 39C14 39 9 35 7 29C4 20 9 10 20 3z"/><path d="M20 9v36M20 20l6-5M20 27l7-5M20 20l-6-5M20 27l-7-5" stroke="#3a1608" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".55"/></svg>'
  ];
  var TURKEY = '<svg viewBox="0 0 200 180"><g class="tg-tail">' +
    '<g stroke="#2a0f08" stroke-width="2">' +
    '<ellipse cx="100" cy="60" rx="16" ry="52" fill="#a3243b" transform="rotate(-75 100 120)"/>' +
    '<ellipse cx="100" cy="60" rx="16" ry="52" fill="#f0a020" transform="rotate(-50 100 120)"/>' +
    '<ellipse cx="100" cy="60" rx="16" ry="52" fill="#d9541e" transform="rotate(-25 100 120)"/>' +
    '<ellipse cx="100" cy="60" rx="16" ry="52" fill="#a3243b" transform="rotate(0 100 120)"/>' +
    '<ellipse cx="100" cy="60" rx="16" ry="52" fill="#d9541e" transform="rotate(25 100 120)"/>' +
    '<ellipse cx="100" cy="60" rx="16" ry="52" fill="#f0a020" transform="rotate(50 100 120)"/>' +
    '<ellipse cx="100" cy="60" rx="16" ry="52" fill="#a3243b" transform="rotate(75 100 120)"/></g></g>' +
    '<path d="M80 168l-4 10M76 178h-8M76 178l2 -2M120 168l4 10M124 178h8" stroke="#f0a020" stroke-width="4" stroke-linecap="round"/>' +
    '<ellipse cx="100" cy="128" rx="38" ry="42" fill="#6b3a1e" stroke="#2a0f08" stroke-width="2"/>' +
    '<ellipse cx="100" cy="138" rx="24" ry="26" fill="#8a4f28"/>' +
    '<circle cx="100" cy="82" r="22" fill="#7a4524" stroke="#2a0f08" stroke-width="2"/>' +
    '<circle cx="92" cy="78" r="5" fill="#fff"/><circle cx="108" cy="78" r="5" fill="#fff"/>' +
    '<circle cx="93" cy="79" r="2.6" fill="#111"/><circle cx="107" cy="79" r="2.6" fill="#111"/>' +
    '<path d="M94 88l6 10 6-10z" fill="#ffc65c" stroke="#2a0f08" stroke-width="1.2"/>' +
    '<path d="M104 92q8 4 4 16q-8 -2 -6 -12z" fill="#c8243b"/></svg>';
  // CHRISTMAS: cabin scene (christmas_scene.jpg) + twinkle lights + fire glow + window snow +
  // string lights + countdown, Mon 11/30/2026 through 12/31 (turns itself off after).
  // Preview any time with ?xmas in the URL (add &screen=N to start on screen N).
  var XMAS_FROM = new Date("2026-11-30T00:00:00-08:00");
  var XMAS_UNTIL = new Date("2027-01-01T00:00:00-08:00");
  var XMAS_PREVIEW = /[?&]xmas/.test(location.search);
  function xmasOn() { var n = new Date(); return XMAS_PREVIEW || (n >= XMAS_FROM && n < XMAS_UNTIL); }
  if (xmasOn()) document.body.style.background = "#0a1424";
  var startAt = (location.search.match(/[?&]screen=(\d+)/) || [])[1];
  // Light positions, in % of the screen, traced off the scene: big wreath, fireplace wreath, mantel garland
  // (no tree lights: they ran over Santa, Jack 11/21).
  var XM_LIGHTS = (function () {
    var p = [], k;
    for (k = 0; k < 16; k++) { var a = k / 16 * 6.283; p.push([49.6 + Math.cos(a) * 7.6, 18 + Math.sin(a) * 13]); }
    for (k = 0; k < 9; k++)  { var b = k / 9 * 6.283;  p.push([81.6 + Math.cos(b) * 4.2, 17.5 + Math.sin(b) * 7.2]); }
    for (k = 0; k < 13; k++) { var s = k / 12; p.push([70 + s * 28, 39 - s * 11 + Math.sin(s * 9.4) * 1.4]); }
    return p;
  })();
  function xmasCount() {
    var n = new Date(), xmas = new Date(n.getFullYear(), 11, 25);
    var days = Math.round((xmas - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000);
    if (days > 1) return '<div class="xm-count"><b>' + days + '</b><span>Days until Christmas</span></div>';
    if (days === 1) return '<div class="xm-count"><b>1</b><span>Day until Christmas</span></div>';
    if (days === 0) return '<div class="xm-count merry"><b>Merry Christmas!</b></div>';
    return '';
  }
  function xmasTheme(d, idx, done) {
    var link = d.createElement("link");
    link.rel = "stylesheet";
    link.href = "christmas.css?v=" + THEME_VERSION;
    link.onload = link.onerror = function () { done(); };
    setTimeout(done, 2500);
    d.head.appendChild(link);
    // behind the words: fire, candles, twinkles, window snow
    var back = d.createElement("div");
    back.className = "xm-fx xm-back";
    var h = '<div class="xm-warm"></div><div class="xm-fire"></div><div class="xm-fire f2"></div>' +
      '<div class="xm-candle" style="left:59.6%;top:76%"></div><div class="xm-candle" style="left:63.8%;top:79%;animation-delay:-.6s"></div>' +
      '<div class="xm-window">';
    for (var f = 0; f < 22; f++) {
      h += '<div class="xm-flake" style="left:' + ((f * 37) % 100) + '%;animation-duration:' + (9 + (f * 7) % 8) +
        's;animation-delay:-' + ((f * 1.7) % 12).toFixed(1) + 's;opacity:' + (0.45 + (f % 4) * 0.15) + '"></div>';
    }
    h += '</div>';
    XM_LIGHTS.forEach(function (pt, k) {
      h += '<div class="xm-tw" style="left:' + pt[0].toFixed(1) + '%;top:' + pt[1].toFixed(1) + '%;animation-delay:-' +
        ((k * 0.73 + idx) % 3).toFixed(2) + 's;animation-duration:' + (2.2 + (k % 5) * 0.5) + 's"></div>';
    });
    back.innerHTML = h;
    d.body.appendChild(back);
    // in front: string lights along the top + countdown
    var fx = d.createElement("div");
    fx.className = "xm-fx";
    var bulbs = '<svg viewBox="0 0 1600 90" preserveAspectRatio="xMidYMin slice"><defs><radialGradient id="xg"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".7"/><stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/></radialGradient></defs>' +
      '<path d="M0 4 Q50 22 100 4 T200 4 T300 4 T400 4 T500 4 T600 4 T700 4 T800 4 T900 4 T1000 4 T1100 4 T1200 4 T1300 4 T1400 4 T1500 4 T1600 4" stroke="#4a3a22" stroke-width="2.5" fill="none"/>';
    for (var b = 0; b < 16; b++) {
      var x = 50 + b * 100, col = ["#fff1c4", "#ffcf7a", "#ffe9a8", "#ffd99a"][b % 4];
      bulbs += '<g transform="translate(' + x + ' 12) scale(1.7) translate(' + (-x) + ' -12)">' +
        '<rect x="' + (x - 3.5) + '" y="12" width="7" height="6" rx="1" fill="#6a5634"/>' +
        '<g class="xm-bulb" style="animation-delay:-' + ((b * 0.61 + idx * 0.3) % 2.4).toFixed(2) + 's">' +
        '<circle cx="' + x + '" cy="27" r="20" fill="url(#xg)"/>' +
        '<path d="M' + (x - 5) + ' 18 Q' + (x - 8) + ' 30 ' + x + ' 37 Q' + (x + 8) + ' 30 ' + (x + 5) + ' 18z" fill="' + col + '"/></g></g>';
    }
    bulbs += '</svg>';
    // lights hang behind the words so a high header (testing boards) still reads on top
    var lights = d.createElement("div");
    lights.className = "xm-fx xm-back";
    lights.innerHTML = '<div class="xm-lights">' + bulbs + '</div>';
    d.body.appendChild(lights);
    fx.innerHTML = xmasCount();
    d.body.appendChild(fx);
  }

  // Dresses up a loaded screen, then calls done() once the theme stylesheet is in.
  function theme(frame, idx, done) {
    if (xmasOn()) { try { return xmasTheme(frame.contentDocument, idx, done); } catch (e) { return done(); } }
    if (new Date() >= THEME_UNTIL) return done();
    try {
      var d = frame.contentDocument;
      var link = d.createElement("link");
      link.rel = "stylesheet";
      link.href = "thanksgiving.css?v=" + THEME_VERSION;
      link.onload = link.onerror = function () { done(); };
      setTimeout(done, 2500);
      d.head.appendChild(link);
      var back = d.createElement("div");
      back.className = "tg-fx tg-back";
      var leaves = "";
      for (var k = 1; k <= 8; k++) {
        leaves += '<div class="tg-leaf l' + k + '">' + LEAVES[k % 2].replace("C", LEAF_COLORS[(k + idx) % LEAF_COLORS.length]) + '</div>';
      }
      back.innerHTML = leaves;
      d.body.appendChild(back);
      var fx = d.createElement("div");
      fx.className = "tg-fx";
      fx.innerHTML = '<div class="tg-border"></div>' +
        '<div class="tg-turkey">' + TURKEY + '</div>';
      d.body.appendChild(fx);
    } catch (e) { done(); }
  }

  // Two frames: the next screen loads hidden, gets its theme, then fades in over the
  // current one, so the plain look never flashes on the TV.
  var frames = [document.getElementById("a"), document.getElementById("b")];
  var cur = 0;
  function show(index) {
    var next = frames[1 - cur];
    next.onload = function () {
      var shown = false;
      theme(next, index, function () {
        if (shown) return;
        shown = true;
        setTimeout(function () {
          // new screen fades in on top while the old one stays solid underneath
          var old = frames[cur];
          next.style.zIndex = 2;
          old.style.zIndex = 1;
          next.classList.add("on");
          cur = 1 - cur;
          // then hide the old one and stop its animations
          setTimeout(function () { old.classList.remove("on"); old.onload = null; old.src = "about:blank"; }, 500);
        }, 300);
      });
    };
    next.src = screens[index] + "?_r=" + Date.now();
  }

  if (XMAS_PREVIEW) screens = screens.map(function (s) {   // preview shows the December screens
    return s.replace("november_itinerary", "december_itinerary").replace("thanksgiving_food_bracket", "christmas_movie_bracket");
  });
  if (startAt) i = +startAt % screens.length;
  show(i);
  setInterval(function () {
    i = (i + 1) % screens.length;
    show(i);
  }, SECONDS_PER_SCREEN * 1000);
</script>
</body>
</html>
