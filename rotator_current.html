<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Current Rotation — Mission Performance SB</title>
<style>
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0c0c0d; }
  iframe { display: block; width: 100vw; height: 100vh; border: none; }
</style>
</head>
<body>
<iframe id="stage" src=""></iframe>
<script>
  // Update this list each month: swap the itinerary + bracket for the new month.
  var screens = [
    "gym_rules_tv.html",
    "october_itinerary_tv.html",
    "halloween_candy_bracket_tv.html",
    "leaderboard_attendance_tv.html",
    "leaderboard_testing_male_tv.html",
    "leaderboard_testing_female_tv.html"
  ];
  var SECONDS_PER_SCREEN = 18;
  var i = 0;
  var frame = document.getElementById("stage");

  // THEME: Halloween 80s look on every screen until Mon 11/2/2026 (turns itself off after).
  var THEME_UNTIL = new Date("2026-11-02T00:00:00-08:00");
  // One horror villain per screen, drawn as neon line art (stroke only).
  var VILLAINS = [
    { name: "Jason", film: "Friday the 13th · 1980",
      svg: '<path d="M50 6C28 6 18 26 18 50s12 44 32 44 32-20 32-44S72 6 50 6z"/>' +
           '<path d="M30 40q8-6 16 0q-8 7-16 0zM54 40q8-6 16 0q-8 7-16 0z"/>' +
           '<path class="red" d="M40 20l4 8 4-8M52 20l4 8 4-8M28 58l5 5 5-5M62 58l5 5 5-5"/>' +
           '<circle cx="50" cy="56" r="2"/><circle cx="42" cy="72" r="2"/><circle cx="50" cy="74" r="2"/><circle cx="58" cy="72" r="2"/>' +
           '<circle cx="36" cy="82" r="1.6"/><circle cx="64" cy="82" r="1.6"/><circle cx="50" cy="86" r="1.6"/>' },
    { name: "Freddy", film: "A Nightmare on Elm Street · 1984",
      svg: '<path d="M30 96V64q0-12 10-14h22q10 2 10 14v32"/>' +
           '<path d="M38 50L30 6M46 50L44 2M54 50L58 3M62 50L72 8"/>' +
           '<path class="red" d="M30 72h42M30 82h42M30 92h42"/>' +
           '<path d="M72 66q12-4 16 4"/>' },
    { name: "Michael Myers", film: "Halloween · 1978",
      svg: '<path d="M50 14c-18 0-26 14-26 32 0 22 10 40 26 40s26-18 26-40c0-18-8-32-26-32z"/>' +
           '<path d="M24 40q-6-26 26-30q32 4 26 30"/>' +
           '<path d="M34 44q6-4 11 0M55 44q5-4 11 0M44 72q6 3 12 0M50 50v12"/>' +
           '<path class="red" d="M86 30L70 92M70 92l-4 6M82 44l6 2"/>' },
    { name: "Leatherface", film: "The Texas Chain Saw Massacre · 1974",
      svg: '<rect x="8" y="42" width="34" height="28" rx="4"/>' +
           '<path d="M16 42v-8h18v8M42 50h46a6 6 0 0 1 0 12H42"/>' +
           '<path class="red" d="M46 50l3-4 3 4 3-4 3 4 3-4 3 4 3-4 3 4 3-4 3 4 3-4 3 4M46 62l3 4 3-4 3 4 3-4 3 4 3-4 3 4 3-4 3 4 3-4 3 4 3-4"/>' +
           '<circle cx="25" cy="56" r="6"/>' },
    { name: "Pennywise", film: "It · 1990",
      svg: '<path class="red" d="M50 8c-16 0-26 12-26 26 0 18 16 30 26 34 10-4 26-16 26-34C76 20 66 8 50 8z"/>' +
           '<path d="M46 68h8l-4 6zM50 74q-8 8 0 14t0 12"/><path d="M38 22q6-6 12-6"/>' },
    { name: "Ghostface", film: "Scream · 1996",
      svg: '<path d="M50 4C30 4 20 22 20 44c0 26 14 48 30 52 16-4 30-26 30-52C80 22 70 4 50 4z"/>' +
           '<path d="M32 36q6-4 10 2l-2 14q-6 2-8-6zM68 36q-6-4-10 2l2 14q6 2 8-6z"/>' +
           '<path d="M44 62q6-4 12 0l-2 22q-4 4-8 0z"/>' }
  ];
  frame.onload = function () {
    if (new Date() >= THEME_UNTIL) return;
    try {
      var d = frame.contentDocument;
      var link = d.createElement("link");
      link.rel = "stylesheet";
      link.href = "halloween80s.css?_r=" + Date.now();
      d.head.appendChild(link);
      var fx = d.createElement("div");
      fx.className = "h80-fx";
      fx.innerHTML = '<div class="h80-flash"></div><div class="h80-scan"></div>' +
        '<div class="h80-bat">🦇</div><div class="h80-bat b2">🦇</div><div class="h80-bat b3">🦇</div>' +
        '<div class="h80-pumpkin"><svg viewBox="0 0 200 180"><defs><radialGradient id="pk" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#ffa340"/><stop offset=".55" stop-color="#e86a10"/><stop offset="1" stop-color="#8a3204"/></radialGradient><radialGradient id="pkr" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ff9a30"/><stop offset=".7" stop-color="#d45a0a"/><stop offset="1" stop-color="#6e2803"/></radialGradient><linearGradient id="st" x1="0" x2="1"><stop offset="0" stop-color="#3d4a1c"/><stop offset=".5" stop-color="#6b7a33"/><stop offset="1" stop-color="#2c3512"/></linearGradient><radialGradient id="fire" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#fff6c0"/><stop offset=".4" stop-color="#ffd23a"/><stop offset="1" stop-color="#ff7a00"/></radialGradient></defs><ellipse cx="100" cy="170" rx="80" ry="8" fill="#000" opacity=".45"/><ellipse cx="44" cy="104" rx="40" ry="62" fill="url(#pkr)"/><ellipse cx="156" cy="104" rx="40" ry="62" fill="url(#pkr)"/><ellipse cx="70" cy="102" rx="42" ry="68" fill="url(#pk)"/><ellipse cx="130" cy="102" rx="42" ry="68" fill="url(#pk)"/><ellipse cx="100" cy="100" rx="40" ry="70" fill="url(#pk)"/><g fill="none" stroke="#7a2c03" stroke-width="2" opacity=".55"><path d="M100 32q-14 68 0 138M100 32q14 68 0 138M62 38q-22 64 4 128M138 38q22 64-4 128"/></g><ellipse cx="78" cy="62" rx="10" ry="22" fill="#fff" opacity=".18" transform="rotate(-20 78 62)"/><path d="M94 38q-2-18 4-30q4-6 10-4l2 6q-6 4-6 12l-2 16z" fill="url(#st)"/><path d="M108 10q14-4 22 6" fill="none" stroke="#4d5a22" stroke-width="3" stroke-linecap="round"/><g class="h80-candle" fill="url(#fire)"><path d="M56 82l22-4-10 22z"/><path d="M144 82l-22-4 10 22z"/><path d="M100 98l-8 16h16z"/><path d="M48 120q52 38 104 0l-8 2-6 12-10-8-8 12-10-10-10 10-8-12-10 8-6-12z"/></g></svg></div>';
      var back = d.createElement("div");
      back.className = "h80-fx h80-back";
      back.innerHTML = '<div class="h80-fog"></div>' +
        '<div class="h80-eyes e1"></div><div class="h80-eyes e2"></div><div class="h80-eyes e3"></div>';
      d.body.appendChild(back);
      var v = VILLAINS[i % VILLAINS.length];
      fx.innerHTML += '<div class="h80-villain"><svg viewBox="0 0 100 100">' + v.svg + '</svg>' +
        '<div class="h80-tag"><b>' + v.name + '</b><span>' + v.film + '</span></div></div>';
      d.body.appendChild(fx);
    } catch (e) {}
  };

  function show(index) {
    frame.src = screens[index] + "?_r=" + Date.now();
  }

  show(i);
  setInterval(function () {
    i = (i + 1) % screens.length;
    show(i);
  }, SECONDS_PER_SCREEN * 1000);
</script>
</body>
</html>
