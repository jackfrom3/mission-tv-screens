<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Current Rotation — Mission Performance SB</title>
<style>
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0c0c0d; }
  iframe { position: absolute; inset: 0; display: block; width: 100vw; height: 100vh; border: none; opacity: 0; transition: opacity 0.35s ease; }
  iframe.on { opacity: 1; }
</style>
</head>
<body>
<iframe id="a"></iframe>
<iframe id="b"></iframe>
<script>
  // Update this list each month: swap the itinerary + bracket for the new month.
  var screens = [
    "gym_rules_tv.html",
    "november_itinerary_tv.html",
    "thanksgiving_food_bracket_tv.html",
    "leaderboard_attendance_tv.html",
    "leaderboard_testing_male_tv.html",
    "leaderboard_testing_female_tv.html"
  ];
  var SECONDS_PER_SCREEN = 18;
  var i = 0;

  // THEME: vintage Thanksgiving look on every screen until Mon 11/30/2026 (turns itself off after).
  var THEME_UNTIL = new Date("2026-11-30T00:00:00-08:00");
  if (new Date() < THEME_UNTIL) document.body.style.background = "#1c0b05";
  var THEME_VERSION = Date.now() - Date.now() % 3600000; // re-fetch the theme at most hourly
  // One public-domain 1800s Thanksgiving artwork per screen (files in thanksgiving_art/, credited on screen).
  var ART = [
    { img: "dinner", title: "Thanksgiving Day \u2014 The Dinner", credit: "Winslow Homer, Harper\u2019s Weekly, 1858 \u00b7 Cleveland Museum of Art \u00b7 CC0" },
    { img: "home", title: "Home to Thanksgiving", credit: "Currier &amp; Ives after George H. Durrie, 1867 \u00b7 National Gallery of Art \u00b7 Public domain" },
    { img: "arrival", title: "Thanksgiving Day \u2014 Arrival at the Old Home", credit: "Winslow Homer, Harper\u2019s Weekly, 1858 \u00b7 Public domain" }
  ];
  // Dresses up a loaded screen, then calls done() once the stylesheet + painting are in.
  function theme(frame, idx, done) {
    if (new Date() >= THEME_UNTIL) return done();
    try {
      var d = frame.contentDocument;
      var art = ART[idx % ART.length];
      var waiting = 2; // stylesheet + painting
      var ready = function () { if (--waiting === 0) done(); };
      setTimeout(done, 3000);
      var link = d.createElement("link");
      link.rel = "stylesheet";
      link.href = "thanksgiving.css?v=" + THEME_VERSION;
      link.onload = link.onerror = ready;
      d.head.appendChild(link);
      var src = "thanksgiving_art/" + art.img + ".webp";
      var pic = new Image();
      pic.onload = pic.onerror = ready;
      pic.src = src;
      var back = d.createElement("div");
      back.className = "tg-fx tg-back";
      back.innerHTML = '<div class="tg-art" style="background-image:url(' + src + ')"></div><div class="tg-shade"></div>';
      d.body.appendChild(back);
      var fx = d.createElement("div");
      fx.className = "tg-fx";
      fx.innerHTML = '<div class="tg-frame"></div>' +
        '<div class="tg-credit"><b>' + art.title + '</b> &nbsp;\u00b7&nbsp; ' + art.credit + '</div>';
      d.body.appendChild(fx);
    } catch (e) { done(); }
  }

  // Two frames: the next screen loads hidden, gets its theme, then fades in over the
  // current one, so the plain look never flashes on the TV.
  var frames = [document.getElementById("a"), document.getElementById("b")];
  var cur = 0;
  function show(index) {
    var next = frames[1 - cur];
    next.onload = function () {
      var shown = false;
      theme(next, index, function () {
        if (shown) return;
        shown = true;
        setTimeout(function () {
          // new screen fades in on top while the old one stays solid underneath
          var old = frames[cur];
          next.style.zIndex = 2;
          old.style.zIndex = 1;
          next.classList.add("on");
          cur = 1 - cur;
          // then hide the old one and stop its animations
          setTimeout(function () { old.classList.remove("on"); old.onload = null; old.src = "about:blank"; }, 500);
        }, 300);
      });
    };
    next.src = screens[index] + "?_r=" + Date.now();
  }

  show(i);
  setInterval(function () {
    i = (i + 1) % screens.length;
    show(i);
  }, SECONDS_PER_SCREEN * 1000);
</script>
</body>
</html>
