<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Current Rotation — Mission Performance SB</title>
<style>
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0c0c0d; }
  iframe { display: block; width: 100vw; height: 100vh; border: none; }
</style>
</head>
<body>
<iframe id="stage" src=""></iframe>
<script>
  // Update this list each month: swap the itinerary + bracket for the new month.
  var screens = [
    "gym_rules_tv.html",
    "october_itinerary_tv.html",
    "halloween_candy_bracket_tv.html",
    "leaderboard_attendance_tv.html",
    "leaderboard_testing_male_tv.html",
    "leaderboard_testing_female_tv.html"
  ];
  var SECONDS_PER_SCREEN = 18;
  var i = 0;
  var frame = document.getElementById("stage");

  // THEME: Halloween 80s look on every screen until Mon 11/2/2026 (turns itself off after).
  var THEME_UNTIL = new Date("2026-11-02T00:00:00-08:00");
  frame.onload = function () {
    if (new Date() >= THEME_UNTIL) return;
    try {
      var d = frame.contentDocument;
      var link = d.createElement("link");
      link.rel = "stylesheet";
      link.href = "halloween80s.css?_r=" + Date.now();
      d.head.appendChild(link);
      var fx = d.createElement("div");
      fx.className = "h80-fx";
      fx.innerHTML = '<div class="h80-flash"></div><div class="h80-scan"></div>' +
        '<div class="h80-bat">🦇</div><div class="h80-bat b2">🦇</div><div class="h80-bat b3">🦇</div>' +
        '<div class="h80-ghost">👻</div><div class="h80-pumpkin">🎃</div>';
      d.body.appendChild(fx);
    } catch (e) {}
  };

  function show(index) {
    frame.src = screens[index] + "?_r=" + Date.now();
  }

  show(i);
  setInterval(function () {
    i = (i + 1) % screens.length;
    show(i);
  }, SECONDS_PER_SCREEN * 1000);
</script>
</body>
</html>
