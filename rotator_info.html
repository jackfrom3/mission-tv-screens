<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Info Rotation — Mission Performance SB</title>
<style>
  html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0c0c0d; }
  iframe { display: block; width: 100vw; height: 100vh; border: none; }
</style>
</head>
<body>
<iframe id="stage" src=""></iframe>
<script>
  var screens = [
    "gym_rules_tv.html",
    "september_itinerary_tv.html",
    "october_itinerary_tv.html",
    "november_itinerary_tv.html",
    "december_itinerary_tv.html"
  ];
  var SECONDS_PER_SCREEN = 18;
  var i = 0;
  var frame = document.getElementById("stage");

  function show(index) {
    frame.src = screens[index] + "?_r=" + Date.now();
  }

  show(i);
  setInterval(function () {
    i = (i + 1) % screens.length;
    show(i);
  }, SECONDS_PER_SCREEN * 1000);
</script>
</body>
</html>
